name: test

on:
  push:
    branches: [master, v2/**]
  pull_request:
    branches: [master]

jobs:
  test:
    name: rust test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Build
        run: make build

      - name: Verify stripped binary
        run: |
          ls -lh dist/*
          file dist/zbrain*
          test -f dist/zbrain.stripped
          stripped=$(wc -c < dist/zbrain.stripped | tr -d ' ')
          unstripped=$(wc -c < dist/zbrain | tr -d ' ')
          echo "unstripped=$unstripped stripped=$stripped"
          test "$stripped" -lt "$unstripped"
          if file dist/zbrain | grep -q debug_info; then file dist/zbrain.stripped | grep -vq debug_info; fi

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: zbrain-${{ matrix.os }}
          path: |
            dist/zbrain
            dist/zbrain.stripped
          if-no-files-found: error

      - name: Smoke
        run: make smoke

      - name: CLI parity smoke
        run: scripts/cli-parity.sh

      - name: Diff check
        run: git diff --check

      - name: Release build
        run: cargo build --release

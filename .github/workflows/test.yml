name: test

on:
  push:
    branches: [master, v2/**]
  pull_request:
    branches: [master]

jobs:
  test:
    name: go test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Focused race tests
        run: go test -race ./internal/runtime ./internal/cli ./internal/view ./internal/mcp

      - name: Build
        run: make build

      - name: Smoke
        run: make smoke

      - name: Diff check
        run: git diff --check

      - name: CGO-free build
        run: CGO_ENABLED=0 go build ./cmd/zbrain

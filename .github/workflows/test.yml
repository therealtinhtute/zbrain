name: test

on:
  push:
    branches: [master, v2/**]
  pull_request:
    branches: [master]

jobs:
  test:
    name: go test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

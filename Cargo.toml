[workspace]
resolver = "2"
members = ["crates/zbrain"]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
include_dir = "0.7"
serde_yml = "0.0.12"
sha2 = "0.10"
